name: Patch Clear FO Once

on:
  push:
    paths:
      - '.github/workflows/patch-clear-fo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index safely
        run: python .github/scripts/patch_clear_fo.py

      - name: Verify only index changed
        run: |
          git status --short
          test -n "$(git status --short index.html)"

      - name: Commit patched index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Add Clear FO button without removing production logs"
          git push
