name: Patch Clear FO Zero Rows Once

on:
  push:
    paths:
      - '.github/workflows/patch-clear-fo-zero-rows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch clear FO to zero rows
        run: python .github/scripts/patch_clear_fo_zero_rows.py
      - name: Verify index changed
        run: |
          git status --short
          test -n "$(git status --short index.html)"
      - name: Commit patched index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Clear FO leaves master table truly empty"
          git push
