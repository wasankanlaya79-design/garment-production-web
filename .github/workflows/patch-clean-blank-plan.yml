name: Patch Clean Blank Plan Once

on:
  push:
    paths:
      - '.github/workflows/patch-clean-blank-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch clean blank plan rows
        run: python .github/scripts/patch_clean_blank_plan.py

      - name: Verify index changed
        run: |
          git status --short
          test -n "$(git status --short index.html)"

      - name: Commit patched index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Keep cleared FO rows truly blank"
          git push
