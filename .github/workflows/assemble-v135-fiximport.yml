name: Restore Known Good Index

on:
  push:
    paths:
      - .github/workflows/assemble-v135-fiximport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full index
        run: git show d3311f85febea79747929018818d4f14660f372b:index.html > index.html

      - name: Verify full index
        run: test $(wc -c < index.html) -gt 200000

      - name: Commit restore
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore known-good full V1.35 index"
          git push
