name: Restore V135 Known Good

on: push

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good index
        run: git show fe48090fc4a138d2a2473e6c5ee50c2b8c5cdcf4:index.html > index.html
      - name: Verify and commit
        run: |
          test "$(wc -c < index.html)" -gt 190000
          grep -q "Production Control V1.35" index.html
          grep -q "เลือกจากทั้งหมด 18 Line" index.html
          grep -q "prod-ok" index.html
          grep -q "prod-repair" index.html
          grep -q "prod-ng" index.html
          grep -q "</html>" index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore exact known-good full V1.35 index"
          git push
