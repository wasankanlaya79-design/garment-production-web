name: Assemble V1.35 Fix Import

on:
  workflow_dispatch:
  push:
    paths:
      - '.deploy_v135_fiximport/**'
      - '.github/workflows/assemble-v135-fiximport.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index.html from staged payload
        shell: bash
        run: |
          cat .deploy_v135_fiximport/part01.b64 \
              .deploy_v135_fiximport/part02.b64 \
              .deploy_v135_fiximport/part03.b64 \
            | tr -cd 'A-Za-z0-9+/=' > /tmp/index.b64
          rem=$(( $(wc -c < /tmp/index.b64) % 4 ))
          if [ "$rem" -eq 2 ]; then printf '==' >> /tmp/index.b64; fi
          if [ "$rem" -eq 3 ]; then printf '='  >> /tmp/index.b64; fi
          echo "sanitized base64 chars: $(wc -c < /tmp/index.b64)"
          base64 -d /tmp/index.b64 > /tmp/index.html.xz
          xz -t /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > index.html
          echo "restored index bytes: $(wc -c < index.html)"

      - name: Verify required fixes
        shell: bash
        run: |
          test $(wc -c < index.html) -gt 200000
          grep -q 'Production Control V1.35' index.html
          grep -q 'เลือกจากทั้งหมด 18 Line' index.html
          grep -q 'Production Plan Master' index.html
          grep -q 'clearPlanFoBtn' index.html
          grep -qi 'production code' index.html
          grep -q 'เคลียร์ FO ทั้งหมด' index.html
          grep -q 'prod-ok' index.html
          grep -q 'prod-repair' index.html
          grep -q 'prod-ng' index.html
          grep -q '</html>' index.html

      - name: Commit rebuilt production page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already up to date'
          else
            git commit -m 'Restore full V1.35 page with fixed Excel import and Clear FO'
            git push
          fi
