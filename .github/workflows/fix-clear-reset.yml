name: Fix Clear FO Reset Once

on:
  push:
    paths:
      - '.github/workflows/fix-clear-reset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Clear FO reset safely
        run: python .github/scripts/fix_clear_reset.py

      - name: Verify index only
        run: |
          git status --short
          test -n "$(git status --short index.html)"
          grep -q 'Reset / เคลียร์ FO' index.html
          grep -q 'เลือกจากทั้งหมด 18 Line' index.html
          grep -q 'prod-ok' index.html
          grep -q 'prod-repair' index.html
          grep -q 'prod-ng' index.html

      - name: Commit fixed index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Fix Clear FO reset without regenerating blank JOB IDs"
          git push
