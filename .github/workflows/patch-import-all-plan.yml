name: Patch Import All Plan Once

on:
  push:
    paths:
      - '.github/workflows/patch-import-all-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch import all plan
        run: python .github/scripts/patch_import_all_plan.py
      - name: Verify index changed
        run: |
          git status --short
          test -n "$(git status --short index.html)"
      - name: Commit patched index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Import all plan rows and auto-rename duplicate JOB IDs"
          git push
